x-spark-common: &spark-common
  image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
  entrypoint: ["/opt/spark/bin/spark-class"]
  volumes:
    - ./jobs:/opt/spark/jobs:ro
    - ./data:/opt/spark/data:ro

services:
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    depends_on:
      - spark-master
    command:
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 2g
      - --work-dir
      - /tmp/spark-work
      - spark://spark-master:7077